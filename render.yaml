services:
  - type: web
    name: api
    env: docker
    plan: free
    dockerfilePath: ./API/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: postgres-db
          property: connectionString

      - key: ConnectionStrings__Redis
        fromService:
          name: redis
          type: redis
          property: connectionString

      - key: MAILGUN_API_KEY
        sync: false
      - key: Jwt__SecretKey
        sync: false

  - type: redis
    name: redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: mailpit
    plan: free
    dockerfilePath: ./mailpit/Dockerfile
    dockerContext: ./mailpit
    env: docker
    ports:
      - 8025

databases:
  - name: postgres-db
    plan: free