services:
  - type: web
    name: dotnet-api
    runtime: docker
    plan: free
    dockerfilePath: ./API/Dockerfile
    autoDeploy: true

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ASPNETCORE_URLS
        value: http://+:8080

      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

      # PostgreSQL
      - key: POSTGRES_HOST
        fromDatabase:
          name: postgres
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: postgres
          property: port

      - key: POSTGRES_USER
        fromDatabase:
          name: postgres
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: postgres
          property: password

      - key: POSTGRES_DB
        fromDatabase:
          name: postgres
          property: database

      # Redis
      - key: REDIS_HOST
        fromService:
          name: redis
          type: redis
          property: host

      - key: REDIS_PORT
        fromService:
          name: redis
          type: redis
          property: port

      # Mailgun
      - key: MAILGUN_API_KEY
        value: 

      # JWT
      - key: Jwt__SecretKey
        value: 
  - type: redis
    name: redis
    plan: free
    ipAllowList:
      - source:

databases:
  - name: postgres
    databaseName: database
    user: user
    plan: free