services:
  - type: web
    name: api
    env: docker
    plan: free
    dockerfilePath: ./API/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080

      - key: POSTGRES_HOST
        value: postgres-db.internal
      - key: POSTGRES_DB
        value: mydb
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: mysecretpassword
      - key: ConnectionStrings__DefaultConnection
        value: "Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"

      - key: REDIS_HOST
        value: redis.internal
      - key: REDIS_PORT
        value: 6379
      - key: ConnectionStrings__Redis
        value: "${REDIS_HOST}:${REDIS_PORT}"

      - key: MAILGUN_API_KEY
        sync: false
      - key: Jwt__SecretKey
        sync: false

  - type: redis
    name: redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: mailpit
    plan: free
    dockerfilePath: ./mailpit/Dockerfile
    dockerContext: ./mailpit
    env: docker

databases:
  - name: postgres-db
    plan: free